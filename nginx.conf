# Marichuy — servidor estático para la SPA.
# Se copia a /etc/nginx/conf.d/default.conf dentro de la imagen.

server {
    listen      8080;
    listen      [::]:8080;
    server_name _;

    root  /usr/share/nginx/html;
    index index.html;

    # ---- Cabeceras de seguridad ----
    # Se heredan en todas las 'location' porque abajo solo se usa 'expires'
    # (que NO resetea la herencia de add_header, a diferencia de un add_header
    #  dentro de un bloque location).
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://*.supabase.co wss://*.supabase.co; worker-src 'self' blob:; frame-src 'none'; frame-ancestors 'none'; form-action 'self'; manifest-src 'self'; upgrade-insecure-requests" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "accelerometer=(), autoplay=(), camera=(self), display-capture=(), encrypted-media=(), fullscreen=(self), geolocation=(), gyroscope=(), microphone=(), midi=(), payment=(), usb=()" always;
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    add_header X-Permitted-Cross-Domain-Policies "none" always;

    # ---- Compresión ----
    gzip            on;
    gzip_vary       on;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_proxied    any;
    gzip_types      text/plain text/css application/javascript application/json
                    image/svg+xml application/manifest+json application/wasm;

    # ---- Healthcheck (lo usa el HEALTHCHECK del Dockerfile y Coolify) ----
    location = /healthz {
        access_log   off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- Activos con hash de contenido: cache larga ----
    location /assets/ {
        expires    1y;
        access_log off;
        try_files  $uri =404;
    }

    # ---- index.html nunca en cache: así un despliegue nuevo se ve al instante ----
    location = /index.html {
        expires -1;
    }

    # ---- SPA: cualquier ruta desconocida devuelve index.html ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- Nunca servir dotfiles (.git, .env, etc.) ----
    location ~ /\.(?!well-known) {
        deny all;
        access_log off;
        log_not_found off;
    }
}
